<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HerCab Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <h1>Welcome Back</h1>

        <p>
            Login to continue your safe journey with HerCab.
        </p>

        <img src="images/hercab.png" alt="Login Image">

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="login-box">

            <h2>Login</h2>

            <form id="loginForm">

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye"
                        id="togglePassword">
                    </i>

                </div>

                <!-- Remember -->

                <div class="remember">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot.html">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->

                <button type="submit">

                    Login

                </button>

                <!-- Register -->

                <p class="register">

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </form>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
