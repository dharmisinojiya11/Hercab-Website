<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passenger Registration | HerCab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="container">

<div class="register-box">

<h1>Passenger Registration</h1>

<p>Create your HerCab account</p>

<form id="registerForm">

<div class="input-box">

<i class="fa fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa fa-phone"></i>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
maxlength="10"
required>

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="input-box">

<i class="fa fa-location-dot"></i>

<input
type="text"
id="city"
placeholder="City"
required>

</div>

<!-- Aadhaar Number -->

<div class="input-box">

<i class="fa-solid fa-id-card"></i>

<input
type="text"
id="aadhaar"
placeholder="Aadhaar Number"
maxlength="12"
required>

</div>

<!-- Aadhaar Front -->

<label>Upload Aadhaar Front</label>

<input
type="file"
accept="image/*"
required>

<br><br>

<!-- Aadhaar Back -->

<label>Upload Aadhaar Back</label>

<input
type="file"
accept="image/*"
required>

<br><br>

<!-- Selfie -->

<label>Live Selfie Verification</label>

<video id="video" width="300" height="220" autoplay></video>

<br><br>

<button type="button" onclick="startCamera()">
Open Camera
</button>

<button type="button" onclick="capturePhoto()">
Capture Selfie
</button>

<br><br>

<canvas id="canvas" width="300" height="220" style="display:none;"></canvas>

<img id="photo" width="300" style="display:none;">

<!-- Emergency Contact -->

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
placeholder="Emergency Contact Number"
maxlength="10"
required>

</div>

<label class="checkbox">

<input
type="checkbox"
required
>

I agree to the 
<a href="terms.html" target="_blank">
Terms & Conditions
</a>

</label>

<button type="submit">

Register

</button>

<p class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

<script src="register.js"></script>

<script src="camera.js"></script>

</body>

</html>
